<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库历史记录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:#151515;border:1px solid #262626;border-radius:16px;padding:16px;margin-bottom:14px}h1{margin:0 0 6px;font-size:24px}.muted{color:#999;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,button{font:inherit;border-radius:11px} input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle;transition:all .18s ease;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}input[type=checkbox]::before{content:"✓";font-size:14px;line-height:1;font-weight:900;color:#0b0b0b;transform:scale(0);opacity:0;transition:all .16s ease}input[type=checkbox]:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1)}input[type=checkbox]:checked{background:rgba(255,255,255,.88);border-color:rgba(255,255,255,.95);box-shadow:0 0 0 4px rgba(255,255,255,.06)}input[type=checkbox]:checked::before{transform:scale(1);opacity:1}tbody tr{transition:background .18s ease,box-shadow .18s ease}tbody tr:has(.taskPick:checked){background:rgba(255,255,255,.045);box-shadow:inset 3px 0 0 rgba(255,255,255,.55)}input{width:100%;background:#202020;color:#fff;border:1px solid #333;padding:11px}button{border:0;padding:11px 14px;font-weight:800;background:#fff;color:#000}.dark{background:#2a2a2a;color:#fff}.red{background:#5a1c1c;color:#ffc4c4}.xbtn{background:#3a1616;color:#ffb6b6;padding:7px 10px;border:1px solid #6a2929;min-width:38px}.copybtn{background:#232323;color:#fff;padding:7px 10px;border:1px solid #3a3a3a}.copybtn:hover,.xbtn:hover,.red:hover{filter:brightness(1.18)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #292929;font-size:13px}th{color:#aaa;position:sticky;top:0;background:#151515}.num{text-align:right}.pill{display:inline-block;background:#242424;border-radius:999px;padding:4px 8px}.details{background:#101010;padding:10px}.details table{min-width:500px}.order-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}.order-photo{background:#181818;border:1px solid #303030;border-radius:12px;overflow:hidden}.order-photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#222}.order-photo b{display:block;padding:9px 10px 2px;word-break:break-word}.order-photo span{display:block;padding:0 10px 10px;color:#999;font-size:12px}.sku-copy{padding:6px 9px;font-size:12px;white-space:nowrap}.ok{color:#83ff9e}.err{color:#ff9a9a}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
.desktop-tabs{display:flex;gap:8px;margin:0 0 14px}.desktop-tabs button.active{background:#fff;color:#000}.work-grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.work-grid .card{margin-bottom:0}.mode-row{display:flex;gap:8px;flex-wrap:wrap}.mode-row button.active{background:#dff8e8;color:#153d26}.scanner-input{font-size:23px;font-weight:800;letter-spacing:.5px;padding:16px}.scan-row{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px}.entry-list{max-height:460px;overflow:auto}.entry{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid #292929}.entry b{flex:1;word-break:break-all}.entry input{width:92px;padding:8px}.total-big{font-size:34px;font-weight:900}.work-note{padding:11px 12px;background:#101010;border:1px solid #292929;border-radius:10px;margin-top:10px}.history-panel.hidden,.workbench.hidden{display:none!important}@media(max-width:860px){.work-grid{grid-template-columns:1fr}.scan-row{grid-template-columns:1fr 100px}.scan-row button{grid-column:1/-1}} 
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><h1>📊 仓库历史记录</h1><div class="muted">管理员登录后查看所有已同步任务。</div></div>

  <div id="loginCard" class="card">
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <input id="email" type="email" placeholder="管理员 Email">
      <input id="password" type="password" placeholder="密码">
    </div>
    <div class="actions"><button onclick="login()">登录</button></div>
    <div id="loginMsg" class="muted" style="margin-top:8px"></div>
  </div>

  <div id="app" class="hidden">
  <div class="desktop-tabs">
    <button id="workbenchTabBtn" class="active" onclick="selectDesktopTab('workbench')">⌁ 工作台</button>
    <button id="historyTabBtn" class="dark" onclick="selectDesktopTab('history')">▦ 历史记录</button>
    <button class="dark" style="margin-left:auto" onclick="logout()">退出</button>
  </div>

  <section id="workbench" class="workbench">
    <div class="card"><h1>仓库工作台</h1><div class="muted">扫码枪扫完后会自动录入；也可切换手动输入 SKU 和数量。</div></div>
    <div class="work-grid">
      <div class="card">
        <b>任务资料</b>
        <div style="display:grid;gap:9px;margin-top:12px">
          <input id="deskEmployee" placeholder="员工姓名">
          <input id="deskCustomer" placeholder="客户（可选）">
          <input id="deskTaskName" placeholder="任务名称（可选）">
          <input id="deskBatchNo" class="hidden" placeholder="入库批次编号（必填）">
          <input id="deskDate" type="date">
        </div>
        <div class="work-note"><div class="muted">工作模式</div><div class="mode-row" style="margin-top:8px"><button id="deskCountMode" onclick="setDeskMode('count')">点货</button><button id="deskOrderMode" class="dark" onclick="setDeskMode('order')">扫单</button><button id="deskInboundMode" class="dark" onclick="setDeskMode('inbound')">入库</button></div></div>
        <button class="red" style="width:100%;margin-top:12px" onclick="resetDeskTask()">↺ 重置本次任务</button>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b id="deskInputTitle">扫码枪 / 手动录入</b><button id="deskInputSwitch" class="dark" onclick="toggleDeskInput()">切换手动录入</button></div>
        <div id="deskScannerArea" style="margin-top:12px"><input id="deskScanner" class="scanner-input" autocomplete="off" placeholder="请用扫码枪扫描 SKU / 条码" onkeydown="if(event.key==='Enter'){event.preventDefault();addDeskScanner()}"><div class="muted" style="margin-top:8px">扫码枪通常会自动发送 Enter；扫完即加入本次任务。</div></div>
        <div id="deskManualArea" class="hidden" style="margin-top:12px"><div class="scan-row"><input id="deskSku" placeholder="输入 SKU / 单号" onkeydown="if(event.key==='Enter'){event.preventDefault();addDeskManual()}"><input id="deskQty" type="number" min="1" value="1" placeholder="数量" onkeydown="if(event.key==='Enter'){event.preventDefault();addDeskManual()}"><button onclick="addDeskManual()">加入</button></div></div>
        <div class="work-note"><span class="muted">本次总数量</span><div id="deskTotal" class="total-big">0</div><span id="deskTypes" class="muted">0 个 SKU</span></div>
        <div class="actions"><button onclick="saveDeskTask()">完成并同步</button><button class="dark" onclick="undoDeskEntry()">撤销上一次</button></div>
        <div id="deskStatus" class="muted" style="margin-top:10px"></div>
        <div id="deskEntries" class="entry-list" style="margin-top:12px"></div>
      </div>
    </div>
  </section>

  <section id="historyPanel" class="history-panel hidden">
    <div class="card">
      <div class="grid">
        <input id="dateFrom" type="date" title="开始日期">
        <input id="dateTo" type="date" title="结束日期">
        <input id="employee" placeholder="员工姓名">
        <input id="task" placeholder="任务名称">
        <input id="skuSearch" placeholder="搜索 SKU / 单号" onkeydown="if(event.key==='Enter')loadTasks()">
      </div>
      <div class="actions">
        <button onclick="loadTasks()">查询</button>
        <button class="dark" onclick="clearFilters()">清除筛选</button>
        <button class="dark" onclick="selectAllVisible()">全选</button>
        <button class="dark" onclick="clearSelection()">取消全选</button>
        <button class="dark" onclick="exportSelected()">导出 Excel</button><button class="dark" onclick="exportSelectedPdf()">导出 PDF</button>
        <button class="red" onclick="deleteSelected()">删除已勾选</button>
      </div>
      <div id="status" class="muted" style="margin-top:10px"></div>
    </div>
    <div class="card tablewrap"><table><thead><tr><th style="width:44px"><input id="selectAllBox" type="checkbox" title="全选当前结果" onchange="toggleSelectAll(this.checked)"></th><th>日期</th><th>员工</th><th>任务名称</th><th class="num">SKU种类</th><th class="num">总数量</th><th>时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
</div>
</div>
<script>
const SUPABASE_URL="https://brqurxainlsteygsqfcu.supabase.co";
const SUPABASE_KEY="sb_publishable_WGmlYFeJDFhyCSteTxQGWQ_3aggl9LK";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
// Task writer mirrors the phone app's anonymous sync client; the admin session remains used for history access.
const taskWriteSb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
let currentTasks=[], taskPhotosByTask={};
const $=id=>document.getElementById(id);

async function login(){
 $('loginMsg').textContent='登录中…';
 const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error){$('loginMsg').textContent='登录失败：'+error.message;$('loginMsg').className='err';return}
 $('loginMsg').textContent='';await showApp();
}
async function logout(){await sb.auth.signOut();location.reload()}
async function showApp(){
 $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');
 $('deskDate').value=new Date().toISOString().slice(0,10);
 $('deskEmployee').value=localStorage.getItem('warehouse_desktop_employee')||'';
 $('deskCustomer').value=localStorage.getItem('warehouse_desktop_customer')||'';
 setDeskMode('count');renderDeskTask();selectDesktopTab('workbench');await loadTasks();
}
async function clearFilters(){['dateFrom','dateTo','employee','task','skuSearch'].forEach(id=>$(id).value='');await loadTasks()}

async function loadTasks(){
 $('status').textContent='读取中…';
 let q=sb.from('tasks').select('*').order('task_date',{ascending:false}).order('created_at',{ascending:false}).limit(1000);
 if($('dateFrom').value)q=q.gte('task_date',$('dateFrom').value);
 if($('dateTo').value)q=q.lte('task_date',$('dateTo').value);
 if($('employee').value.trim())q=q.ilike('employee_name','%'+$('employee').value.trim()+'%');
 if($('task').value.trim())q=q.ilike('task_name','%'+$('task').value.trim()+'%');
 const {data,error}=await q;
 if(error){$('status').textContent='读取失败：'+error.message;$('status').className='err';return}
 currentTasks=data||[];
 const skuKeyword=$('skuSearch').value.trim();
 if(skuKeyword){
   const {data:matches,error:matchError}=await sb.from('task_items').select('task_id').ilike('sku','%'+skuKeyword+'%');
   if(matchError){$('status').textContent='SKU/单号搜索失败：'+matchError.message;$('status').className='err';return}
   const ids=new Set((matches||[]).map(x=>x.task_id));
   currentTasks=currentTasks.filter(x=>ids.has(x.id));
 }
 $('status').className='muted';$('status').textContent=`共 ${currentTasks.length} 个任务`;
 renderTasks();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderTasks(){
 const tb=$('tbody');tb.innerHTML='';
 if(!currentTasks.length){tb.innerHTML='<tr><td colspan="8" class="muted">没有记录</td></tr>';const all=$('selectAllBox');if(all){all.checked=false;all.indeterminate=false}return}
 currentTasks.forEach(t=>{
   const tr=document.createElement('tr');
   tr.innerHTML=`<td><input class="taskPick" type="checkbox" data-id="${t.id}" onchange="updateSelectAllState()"></td><td>${esc(t.task_date)}</td><td>${esc(t.employee_name)}</td><td>${esc(t.task_name||'')}${t.customer_name?'<div class="muted" style="margin-top:3px">客户：'+esc(t.customer_name)+'</div>':''}${t.task_content==="inbound"&&t.batch_no?'<div class="muted" style="margin-top:3px">批次：'+esc(t.batch_no)+'</div>':''} <span class="pill">${t.task_content==="order"?"扫单":t.task_content==="inbound"?"入库":"点货"}</span></td><td class="num">${t.sku_types}</td><td class="num">${t.total_qty}</td><td>${new Date(t.created_at).toLocaleString()}</td><td><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><button class="dark" style="padding:7px 10px" onclick="toggleDetails('${t.id}',this)">查看明细</button>${t.task_content==="order"?`<button class="copybtn" onclick="copyOrderBatch('${t.id}')">复制批次物流单号</button>`:`<button class="copybtn" onclick="copyTask('${t.id}')">复制批次</button>`}</div></td>`;
   tb.appendChild(tr);
   const detail=document.createElement('tr');detail.id='d_'+t.id;detail.className='hidden';detail.innerHTML='<td colspan="8" class="details"><div class="muted">读取 SKU…</div></td>';tb.appendChild(detail);
 });
}
async function toggleDetails(id,btn){
 const row=$('d_'+id);if(!row.classList.contains('hidden')){row.classList.add('hidden');btn.textContent='查看明细';return}
 row.classList.remove('hidden');btn.textContent='收起';
 const cell=row.querySelector('td');cell.innerHTML='<div class="muted">读取 SKU 和单号照片…</div>';
 const task=currentTasks.find(x=>x.id===id);
 const isOrder=task?.task_content==="order";
 const isInbound=task?.task_content==="inbound";
 const itemsResult=await sb.from('task_items').select('sku,qty').eq('task_id',id).order('sku');
 const photosResult=(isOrder||isInbound)?await sb.from('task_order_photos').select('order_no,storage_path,captured_at').eq('task_id',id).order('captured_at'):{data:[],error:null};
 if(itemsResult.error){cell.innerHTML='<div class="err">读取失败：'+esc(itemsResult.error.message)+'</div>';return}
 let photosHtml='';
 if(photosResult.error){
   photosHtml='<div class="err" style="margin-top:14px">照片读取失败：'+esc(photosResult.error.message)+'</div>';
 }else if((photosResult.data||[]).length){
   const signed=await Promise.all(photosResult.data.map(async photo=>{
     const {data,error}=await sb.storage.from('task-order-photos').createSignedUrl(photo.storage_path,3600);
     return {...photo,url:error?'':data?.signedUrl||''};
   }));
   taskPhotosByTask[id]=signed;
   photosHtml='<h3 style="margin:18px 0 8px">'+(isInbound?'入库 / 异常照片':'单号照片')+'</h3><div class="order-photo-grid">'+signed.map(photo=>
     '<div class="order-photo">'+(photo.url?'<a href="'+esc(photo.url)+'" target="_blank" rel="noopener"><img src="'+esc(photo.url)+'" alt="单号 '+esc(photo.order_no)+'"></a>':'<div class="muted" style="padding:12px">照片链接失效</div>')+
     '<b>单号：'+esc(photo.order_no)+'</b><span>'+new Date(photo.captured_at).toLocaleString()+'</span></div>'
   ).join('')+'</div>';
 }else{
   photosHtml='<div class="muted" style="margin-top:14px">'+(isInbound?'这个入库任务没有照片':'这个任务没有单号照片')+'</div>';
 }
 cell.innerHTML='<table><thead><tr><th>SKU / 单号</th><th class="num">数量</th><th>操作</th></tr></thead><tbody>'+(itemsResult.data||[]).map(x=>`<tr><td>${esc(x.sku)}</td><td class="num">${x.qty}</td><td>${isOrder?`<button class="copybtn sku-copy" onclick="copySkuPhoto('${id}','${encodeURIComponent(x.sku)}')">复制照片</button> <button class="copybtn sku-copy" onclick="copySkuNumber('${encodeURIComponent(x.sku)}')">复制物流单号</button> <button class="copybtn sku-copy" onclick="copySkuTogether('${id}','${encodeURIComponent(x.sku)}')">复制照片+单号</button>`:`<button class="copybtn sku-copy" onclick="copySkuNumber('${encodeURIComponent(x.sku)}')">复制 SKU</button>`}</td></tr>`).join('')+'</tbody></table>'+photosHtml;
}
async function copySkuTogether(taskId,encodedSku){
 const sku=decodeURIComponent(encodedSku);
 const photo=(taskPhotosByTask[taskId]||[]).find(x=>String(x.order_no)===String(sku)&&x.url);
 if(!photo){$('status').className='err';$('status').textContent='这个单号没有已保存的照片';return}
 try{
   const source=await (await fetch(photo.url)).blob();
   const image=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(source),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=reject;img.src=url});
   const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.getContext('2d').drawImage(image,0,0);
   const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw new Error('Image conversion failed');
   const dataUrl=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(png)});
   const text='单号：'+sku;
   const html='<div><img src="'+dataUrl+'" alt="'+esc(text)+'"><p>'+esc(text)+'</p></div>';
   await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]);
   $('status').className='ok';$('status').textContent='已复制单号和原始照片';
 }catch(e){console.error(e);$('status').className='err';$('status').textContent='此软件不支持组合复制，请用两个独立按钮'}
}
function copySkuNumber(encodedSku){
 const text=decodeURIComponent(encodedSku);
 navigator.clipboard.writeText(text).then(()=>{$('status').className='ok';$('status').textContent='已复制单号'}).catch(()=>alert(text));
}
async function copySkuPhoto(taskId,encodedSku){
 const sku=decodeURIComponent(encodedSku);
 const photos=(taskPhotosByTask[taskId]||[]).filter(photo=>String(photo.order_no)===String(sku)&&photo.url);
 if(!photos.length){$('status').className='err';$('status').textContent='这个单号没有已保存的照片';return}
 $('status').className='muted';$('status').textContent='正在复制原始照片…';
 try{
   const response=await fetch(photos[0].url);
   if(!response.ok)throw new Error('Photo download failed');
   const source=await response.blob();
   const image=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(source),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=reject;img.src=url});
   const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
   canvas.getContext('2d').drawImage(image,0,0);
   const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!png)throw new Error('Image conversion failed');
   if(!navigator.clipboard?.write||!window.ClipboardItem)throw new Error('Image clipboard unavailable');
   await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);
   $('status').className='ok';$('status').textContent='已复制原始照片';
 }catch(e){
   console.error(e);$('status').className='err';$('status').textContent='此浏览器不支持复制图片，请长按照片保存';
 }
}
function selectedIds(){return [...document.querySelectorAll('.taskPick:checked')].map(x=>x.dataset.id)}
function toggleSelectAll(checked){document.querySelectorAll('.taskPick').forEach(x=>x.checked=checked);updateSelectAllState()}
function selectAllVisible(){toggleSelectAll(true)}
function clearSelection(){toggleSelectAll(false)}
function updateSelectAllState(){
 const boxes=[...document.querySelectorAll('.taskPick')], checked=boxes.filter(x=>x.checked).length, all=$('selectAllBox');
 if(!all)return; all.checked=boxes.length>0&&checked===boxes.length; all.indeterminate=checked>0&&checked<boxes.length;
 $('status').textContent=`共 ${currentTasks.length} 个任务，已勾选 ${checked} 个`;
}


async function copyOrderBatch(id){
 const t=currentTasks.find(x=>x.id===id);
 if(!t)return alert('找不到这条历史记录');
 $('status').className='muted';$('status').textContent='正在读取本批次物流单号…';
 const {data,error}=await sb.from('task_items').select('sku,qty').eq('task_id',id).order('sku');
 if(error){$('status').className='err';$('status').textContent='复制失败：'+error.message;return}
 const numbers=(data||[]).flatMap(x=>Array(Math.max(1,Number(x.qty)||1)).fill(String(x.sku))).join('\n');
 if(!numbers){$('status').className='err';$('status').textContent='这个批次没有物流单号';return}
 try{await navigator.clipboard.writeText(numbers);$('status').className='ok';$('status').textContent='已复制本批次物流单号';}
 catch(e){const ta=document.createElement('textarea');ta.value=numbers;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();$('status').className=ok?'ok':'err';$('status').textContent=ok?'已复制本批次物流单号':'复制失败，请重试';}
}
async function copyTask(id){
 const t=currentTasks.find(x=>x.id===id);
 if(!t)return alert('找不到这条历史记录');
 $('status').className='muted';$('status').textContent='正在读取 SKU 明细…';
 const {data,error}=await sb.from('task_items').select('sku,qty').eq('task_id',id).order('sku');

async function deleteTasks(ids){
  $('status').className='muted';$('status').textContent='正在删除…';
  const {data:photos,error:photoReadError}=await sb.from('task_order_photos').select('storage_path').in('task_id',ids);
  if(photoReadError){$('status').textContent='删除失败（读取照片）：'+photoReadError.message;$('status').className='err';return false}
  const r0=await sb.from('task_order_photos').delete().in('task_id',ids);
  if(r0.error){$('status').textContent='删除失败（照片记录）：'+r0.error.message;$('status').className='err';return false}
  const r1=await sb.from('task_items').delete().in('task_id',ids);
  if(r1.error){$('status').textContent='删除失败（SKU 明细）：'+r1.error.message;$('status').className='err';return false}
  const r2=await sb.from('tasks').delete().in('id',ids);
  if(r2.error){$('status').textContent='删除失败（任务）：'+r2.error.message;$('status').className='err';return false}
  const paths=(photos||[]).map(x=>x.storage_path).filter(Boolean);
  if(paths.length){const sr=await sb.storage.from('task-order-photos').remove(paths);if(sr.error)console.warn('照片文件清理失败：',sr.error.message)}
  $('status').className='muted';$('status').textContent='已删除 '+ids.length+' 条任务';
  await loadTasks();return true;
}

function selectDesktopTab(tab){
 const work=tab==='workbench';$('workbench').classList.toggle('hidden',!work);$('historyPanel').classList.toggle('hidden',work);

 $('historyTabBtn').classList.toggle('active',!work);$('historyTabBtn').classList.toggle('dark',work);

function setDeskMode(mode){

 [['count','deskCountMode'],['order','deskOrderMode'],['inbound','deskInboundMode']].forEach(([key,id])=>{$(id).classList.toggle('active',key===mode);$(id).classList.toggle('dark',key!==mode)});

 $('deskTaskName').classList.toggle('hidden',mode==='inbound');
 $('deskInputTitle').textContent=mode==='order'?'扫码枪 / 手动录入单号':mode==='inbound'?'入库 SKU 录入':'扫码枪 / 手动录入';
}
function toggleDeskInput(){
 deskManual=!deskManual;$('deskScannerArea').classList.toggle('hidden',deskManual);$('deskManualArea').classList.toggle('hidden',!deskManual);
 $('deskInputSwitch').textContent=deskManual?'切换扫码枪':'切换手动录入';
 setTimeout(()=>deskManual?$('deskSku').focus():$('deskScanner').focus(),0);
}
function addDesk(sku,qty){
 sku=(sku||'').trim();qty=Math.max(1,parseInt(qty,10)||1);if(!sku)return false;
 if(deskMode==='order')qty=1;
 deskCounts[sku]=(deskCounts[sku]||0)+qty;deskHistory.push({sku,qty});renderDeskTask();return true;
}
function addDeskScanner(){const input=$('deskScanner');if(addDesk(input.value,1)){input.value='';input.focus()}}
function addDeskManual(){const sku=$('deskSku'),qty=$('deskQty');if(addDesk(sku.value,qty.value)){sku.value='';qty.value='1';sku.focus()}}
function undoDeskEntry(){const last=deskHistory.pop();if(!last)return;deskCounts[last.sku]-=last.qty;if(deskCounts[last.sku]<=0)delete deskCounts[last.sku];renderDeskTask()}
function renderDeskTask(){
 const entries=Object.entries(deskCounts).sort((a,b)=>a[0].localeCompare(b[0]));const total=entries.reduce((sum,[,qty])=>sum+qty,0);
 $('deskTotal').textContent=total;$('deskTypes').textContent=entries.length+' 个 SKU / 单号';
 $('deskEntries').innerHTML=entries.length?entries.map(([sku,qty])=>'<div class="entry"><b>'+esc(sku)+'</b><input type="number" min="1" value="'+qty+'" data-sku="'+esc(sku)+'" onchange="changeDeskQty(this.dataset.sku,this.value)"><button class="xbtn" data-sku="'+esc(sku)+'" onclick="removeDeskSku(this.dataset.sku)">×</button></div>').join(''):'<div class="muted" style="padding:18px 0">等待扫码枪扫描或手动录入…</div>';
}
function changeDeskQty(sku,qty){qty=Math.max(1,parseInt(qty,10)||1);deskCounts[sku]=qty;deskHistory=Object.entries(deskCounts).map(([s,q])=>({sku:s,qty:q}));renderDeskTask()}
function removeDeskSku(sku){delete deskCounts[sku];deskHistory=deskHistory.filter(x=>x.sku!==sku);renderDeskTask()}
function resetDeskTask(){if(Object.keys(deskCounts).length&&!confirm('重置会清空本次未同步的录入，是否继续？'))return;deskCounts={};deskHistory=[];$('deskStatus').textContent='';renderDeskTask();(deskManual?$('deskSku'):$('deskScanner')).focus()}

 if(deskMode==='inbound'&&!batchNo)return alert('入库请填写批次编号');
